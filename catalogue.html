<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corneli Catalogue</title>
    <link rel="stylesheet" href="corneli-app/assets/style/main.css">
</head>

<body>
    <!-- HEADER -->

    <div data-include="/components/header.html"></div>

    <!-- MAIN -->

    <main class="main">
        <section class="catalogue-section">
            <div class="catalogue-section__container section--container">
                <div class="catalogue-section__hero">
                    <div class="catalogue-section__path"></div>
                    <div class="catalogue-section__content">
                        <h1 class="catalogue-section__title section--title">
                            Built for More
                        </h1>
                        <p class="catalogue-section__subtitle">
                            Explore Corneli technology designed for creators, professionals and modern workspaces.
                            Performance without unnecessary complexity.
                        </p>
                    </div>
                </div>

                <button class="to-top" aria-label="Back to top" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 1024 1024">
                        <title>top</title>
                        <path fill="currentColor"
                            d="M572.2 205.3v600.3a30.1 30.1 0 1 1-60.2 0V205.3L292.4 438.6a29 29 0 0 1-42.7 0a33.4 33.4 0 0 1 0-45.2l271-288a29 29 0 0 1 42.7 0l271.1 288a33.4 33.4 0 0 1 0 45.2a29 29 0 0 1-42.6 0z" />
                    </svg>
                </button>


                <div class="catalogue-section__body">
                    <div class="catalogue-section__filter-container">

                        <div class="catalogue-section__filter-main">
                            <ul class="catalogue-section__list">
                                <li class="catalogue-section__item">
                                    <button class="catalogue-section__filter-btn cta-button" data-id="all">All</button>
                                </li>
                                <li class="catalogue-section__item">
                                    <button class="catalogue-section__filter-btn cta-button"
                                        data-id="desktops">Desktops</button>
                                </li>
                                <li class="catalogue-section__item">
                                    <button class="catalogue-section__filter-btn cta-button"
                                        data-id="laptops">Laptops</button>
                                </li>
                                <li class="catalogue-section__item">
                                    <button class="catalogue-section__filter-btn cta-button"
                                        data-id="monitors">Monitors</button>
                                </li>
                                <li class="catalogue-section__item">
                                    <button class="catalogue-section__filter-btn cta-button"
                                        data-id="accessories">Accessories</button>
                                </li>
                            </ul>
                        </div>

                        <div class="catalogue-section__filter-stack">
                            <button class="catalogue-section__filter-btn cta-button btn--filter">
                                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                                    <title>filter</title>
                                    <path fill="none" stroke="currentColor" stroke-linecap="round"
                                        stroke-miterlimit="10" stroke-width="1.5"
                                        d="M21.25 12H8.895m-4.361 0H2.75m18.5 6.607h-5.748m-4.361 0H2.75m18.5-13.214h-3.105m-4.361 0H2.75m13.214 2.18a2.18 2.18 0 1 0 0-4.36a2.18 2.18 0 0 0 0 4.36Zm-9.25 6.607a2.18 2.18 0 1 0 0-4.36a2.18 2.18 0 0 0 0 4.36Zm6.607 6.608a2.18 2.18 0 1 0 0-4.361a2.18 2.18 0 0 0 0 4.36Z" />
                                </svg>
                                <span>Filter</span>
                            </button>

                            <div class="filter-block">
                                <div class="filter-block-body">
                                    <ul class="filter-block__list">
                                        <li class="filter-block__item featured">
                                            <button>
                                                Featured
                                            </button>
                                        </li>
                                        <li class="filter-block__item most-relevant">
                                            <button>
                                                Most relevant
                                            </button>
                                        </li>
                                        <li class="filter-block__item best-selling">
                                            <button>
                                                Best selling
                                            </button>
                                        </li>
                                        <li class="filter-block__item alphabetically--filter">
                                            <button>
                                                Alphabetically, A-Z
                                            </button>
                                        </li>
                                        <li class="filter-block__item alphabetically--filter-reverse">
                                            <button>
                                                Alphabetically, Z-A
                                            </button>
                                        </li>
                                        <li class="filter-block__item low-to-high">
                                            <button>
                                                Price, low to high
                                            </button>
                                        </li>
                                        <li class="filter-block__item high-to-low">
                                            <button>
                                                Price, high to low
                                            </button>
                                        </li>
                                        <li class="filter-block__item old-to-new">
                                            <button>
                                                Date, old to new
                                            </button>
                                        </li>
                                        <li class="filter-block__item new-to-old">
                                            <button>
                                                Date, new to old
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="catalogue-section__product-grid"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->

    <div data-include="/components/footer.html"></div>

    <script src="corneli-app/js/main.js" type="module"></script>
    <script src="corneli-app/js/include.js"></script>
</body>

</html>
